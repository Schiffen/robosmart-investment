[pytest]
testpaths = tests
addopts = -q

filterwarnings =
    # numpy 2.1 on Apple's Accelerate BLAS emits divide-by-zero / overflow /
    # invalid-value RuntimeWarnings from `matmul` even when every input and
    # output is finite — the vectorised kernel doesn't clear the FP error state.
    # Verified spurious for portfolio_metrics._aligned_portfolio_returns: the
    # result matches np.einsum and an explicit dot-product loop to 3.5e-18, and
    # np.isfinite() holds across the whole array. Filtered narrowly to `matmul`
    # so a real numerical failure anywhere else still surfaces.
    ignore:divide by zero encountered in matmul:RuntimeWarning
    ignore:overflow encountered in matmul:RuntimeWarning
    ignore:invalid value encountered in matmul:RuntimeWarning
